pid /tmp/nginx.pid;

events {}

http {

    server {
        listen 8080;

        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;

        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml+rss
            text/javascript;
    }
}