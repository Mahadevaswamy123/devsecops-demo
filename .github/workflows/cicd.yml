name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "kubernetes/deployment.yaml"

  pull_request:
    branches:
      - main

# Required for GitHub Actions to commit Kubernetes changes.
permissions:
  contents: write

jobs:

  # ==========================================
  # UNIT TESTING
  # ==========================================
  test:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || echo "No tests found, would add tests in a real project"


  # ==========================================
  # LINTING
  # ==========================================
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint


  # ==========================================
  # BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - test
      - lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/


  # ==========================================
  # DOCKER BUILD, SCAN AND PUSH
  # ==========================================
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - build

    outputs:
      image_tag: ${{ steps.set_output.outputs.image_tag }}

    env:
      # IMPORTANT:
      # Replace "your-app" with your actual Docker Hub repository.
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: dist/

      # ------------------------------------------
      # Docker Buildx
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------
      # Login to Docker Hub
      # ------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # Generate Docker image tags
      # ------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest

      # ------------------------------------------
      # Build Docker image
      # ------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ------------------------------------------
      # Security scan with Trivy
      # ------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # ------------------------------------------
      # Push Docker image to Docker Hub
      # ------------------------------------------
      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ------------------------------------------
      # Set image tag output
      # ------------------------------------------
      - name: Set image tag output
        id: set_output
        run: |
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


  # ==========================================
  # UPDATE KUBERNETES DEPLOYMENT
  # ==========================================
  update-k8s:
    name: Update Kubernetes Deployment
    runs-on: ubuntu-latest

    needs:
      - docker

    # Only update Kubernetes on pushes to main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      # ------------------------------------------
      # Checkout repository
      # ------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Configure Git
      # ------------------------------------------
      - name: Setup Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------
      # Update Kubernetes deployment
      # ------------------------------------------
      - name: Update Kubernetes deployment file
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        run: |
          set -e
          NEW_IMAGE="docker.io/${DOCKERHUB_USERNAME}/devsecops:${IMAGE_TAG}"

          echo "Updating Kubernetes image..."
          echo "New image: ${NEW_IMAGE}"

          sed -i "s|^[[:space:]]*image:.*|        image: ${NEW_IMAGE}|" kubernetes/deployment.yaml

          
          echo "Updated Kubernetes deployment:"
          grep "image:" kubernetes/deployment.yaml

          # Verify the image was updated
          if ! grep -q "${NEW_IMAGE}" kubernetes/deployment.yaml; then
            echo "ERROR: Failed to update Kubernetes image."
            exit 1
          fi

          echo "Kubernetes image updated successfully."


      # ------------------------------------------
      # Commit and push changes
      # ------------------------------------------
      - name: Commit and push changes
        run: |
          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Kubernetes deployment with new image tag: ${{ needs.docker.outputs.image_tag }} [skip ci]"
            git push
          fi
